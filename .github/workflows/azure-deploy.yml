# Template: place under .github/workflows only after creating the approved Azure
# Static Web App and supplying its deployment token as this Actions secret.
name: Deploy Work Hub to approved Azure environment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run check
      - run: npm run build --prefix api
      - run: npm prune --prefix api --omit=dev --no-audit --no-fund
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
